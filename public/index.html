<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة القارئ الذكي | التقييم المبكر لمهارات القراءة وتتبع النظر</title>
  <!-- خطوط عربية حديثة وعالية الوضوح للأطفال والمعلمين -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <!-- مكتبة WebGazer.js مفتوحة المصدر لتتبع حركة العين عبر كاميرا الويب -->
  <script src="js/webgazer.js"></script>
</head>
<body>
  <div class="app-layout">
    <!-- الشريط الجانبي (Sidebar) -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon">👁️</span>
        <div>
          <h2>القارئ الذكي</h2>
          <small>فرز صعوبات القراءة بالذكاء الاصطناعي</small>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="javascript:void(0)" class="nav-link active" data-view="dashboard">
          <span class="icon">📊</span>
          <span>لوحة التحكم المدرسية</span>
        </a>
        <a href="javascript:void(0)" class="nav-link" data-view="assessment">
          <span class="icon">⚡</span>
          <span>جلسة فحص جديدة</span>
        </a>
        <a href="javascript:void(0)" class="nav-link" data-view="texts">
          <span class="icon">📚</span>
          <span>بنك النصوص المعيارية</span>
        </a>
        <a href="javascript:void(0)" class="nav-link" data-view="intervention">
          <span class="icon">🎯</span>
          <span>تمارين التدخل والتدريب</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-pill">
          <div class="user-avatar">س</div>
          <div>
            <strong>أ. سارة المنصور</strong>
            <small>أخصائية صعوبات التعلم</small>
          </div>
        </div>
      </div>
    </aside>

    <!-- المحتوى الرئيسي (Main Content Area) -->
    <main class="main-content">
      <div id="main-view-container">
        <!-- يتم رندرة الشاشات ديناميكياً هنا -->
      </div>
    </main>

  </div>

  <!-- النافذة المنبثقة العامة (Modal) لعرض التقارير وإضافة الطلاب -->
  <div id="app-modal" class="modal-backdrop">
    <div class="modal-card">
      <button class="modal-close-btn" onclick="window.dashboardModule.closeModal()">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- ملفات الجافاسكريبت بالترتيب الصحيح -->
  <script src="js/texts.js"></script>
  <script src="js/metrics.js"></script>
  <script src="js/tracker.js"></script>
  <script src="js/visualizer.js"></script>
  <script src="js/report.js"></script>
  <script src="js/intervention.js"></script>
  <script src="js/assessment.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
