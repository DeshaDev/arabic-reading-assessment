name: Validate prototype
on:
  push:
    branches: ["main", "codex/professional-reading-assessment"]
  pull_request:
    branches: ["main"]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test descriptive metrics
        run: npm test
      - name: Check server syntax
        run: node --check server.js
      - name: Check application JavaScript syntax
        run: |
          node --check public/js/app.js
          node --check public/js/assessment.js
          node --check public/js/assessment-enhancements.js
          node --check public/js/assessment-protocol.js
          node --check public/js/dashboard.js
          node --check public/js/metrics.js
          node --check public/js/pages-demo-mode.js
          node --check public/js/report.js
          node --check public/js/tracker.js
          node --check lib/reading-alignment.js
          node --check lib/transcription-config.js
          node --check lib/transcription-benchmark.js
          node --check scripts/evaluate-transcription-benchmark.js
          node --check test/transcription-benchmark.test.js
          node --check test/transcription-benchmark-cli.test.js
          node --check test/server.integration.test.js
          node --check test/transcription-config.test.js
